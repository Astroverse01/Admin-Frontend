version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:7
    container_name: astro-admin-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - astro-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis service (optional)
  redis:
    image: redis:7-alpine
    container_name: astro-admin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - astro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astro-admin-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"  # Change APP_PORT in .env or here if 8080 is in use
    environment:
      PORT: 8080
      MONGO_URI: mongodb://admin:password@mongodb:27017/?authSource=admin
      REDIS_URL: redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      GIN_MODE: release
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - astro-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  astro-network:
    driver: bridge